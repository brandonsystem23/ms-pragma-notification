server:
  port: 8082

spring:
  application:
    name: notification_service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 60000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

notification:
  pin:
    expiration-minutes: 30
    length: 6

logging:
  level:
    root: INFO

vonage:
  api-key: ${VONAGE_API_KEY:c9a67c0b}
  api-secret: ${VONAGE_API_SECRET:7Dm^Niw%l26F}

