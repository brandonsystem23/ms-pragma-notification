server:
  port: 8082

spring:
  application:
    name: notification_service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 60000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

notification:
  pin:
    expiration-minutes: 15
    length: 6

logging:
  level:
    root: INFO
