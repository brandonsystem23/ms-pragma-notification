plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
}

group = 'com.plazoleta'
version = '2.2.1'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	mapstructVersion = '1.6.3'
	springdocVersion = '2.8.17'
	jjwtVersion = '0.12.6'
}

dependencies {

	// WEBFLUX
	implementation 'org.springframework.boot:spring-boot-starter-webflux'

	// SECURITY
	implementation 'org.springframework.boot:spring-boot-starter-security'

	// VALIDATION
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// MAPSTRUCT
	implementation "org.mapstruct:mapstruct:${mapstructVersion}"
	annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"

	// SWAGGER
	implementation("org.springdoc:springdoc-openapi-starter-webflux-ui:${springdocVersion}") {
		exclude group: 'org.apache.commons', module: 'commons-lang3'
	}

	implementation 'org.apache.commons:commons-lang3:3.18.0'

	// JWT
	implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
	runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
	runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

	// VONAGE
	implementation 'com.vonage:server-sdk:9.3.1'

	// REDIS REACTIVE
	implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'

	// LOMBOK
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'

	// TEST
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.projectreactor:reactor-test'
}

tasks.withType(JavaCompile).configureEach {
	options.compilerArgs += ['-parameters']
}

tasks.named('test') {
	useJUnitPlatform()
}

jacoco {
	toolVersion = '0.8.14'
}

def jacocoExclusions = [
		'com/plazoleta/notification_service/NotificationServiceApplication*',
		'com/plazoleta/notification_service/application/dto/**',
		'com/plazoleta/notification_service/application/mapper/**',
		'com/plazoleta/notification_service/domain/model/**',
		'com/plazoleta/notification_service/domain/port/**',
		'com/plazoleta/notification_service/infrastructure/out/redis/dto/**',
		'com/plazoleta/notification_service/infrastructure/out/redis/mapper/**',
		'com/plazoleta/notification_service/infrastructure/out/jwt/mapper/**',
		'com/plazoleta/notification_service/infrastructure/out/jwt/dto/**',
]

tasks.named('jacocoTestReport') {
	dependsOn tasks.test

	reports {
		html.required = true
		xml.required = true
		csv.required = false
	}

	classDirectories.setFrom(
			files(classDirectories.files.collect {
				fileTree(dir: it, excludes: jacocoExclusions)
			})
	)
}

tasks.named('jacocoTestCoverageVerification') {
	dependsOn tasks.test

	classDirectories.setFrom(
			files(classDirectories.files.collect {
				fileTree(dir: it, excludes: jacocoExclusions)
			})
	)

	violationRules {
		rule {
			element = 'BUNDLE'
			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 0.95
			}
		}
	}
}

tasks.named('check') {
	dependsOn tasks.named('jacocoTestCoverageVerification')
}
